version: '3.5'

services:
  tasktracker:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - tasktracker_data:/app/data
      # Shared with other systems on the host (each mounts its own copy of
      # this same host path) so they can drop onboarding/offboarding report
      # JSON files here for import. Leave ONBOARDING_IMPORT_DIR unset to
      # disable the import entirely.
      - ${ONBOARDING_IMPORT_HOST_DIR:-/srv/shared/onboarding-import}:/app/import
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=${TZ:-America/Montevideo}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-TaskTracker2025!}
      - USER_USERNAME=${USER_USERNAME:-user}
      - USER_PASSWORD=${USER_PASSWORD:-User2025!}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-onboarding@tasktracker.pro}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://clientes.cenas-support.com}
      - ADMIN_NOTIFICATION_EMAIL=${ADMIN_NOTIFICATION_EMAIL:-}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO:-mathias@cenas.uy}
      - ONBOARDING_STALE_DAYS=${ONBOARDING_STALE_DAYS:-2}
      - EXTERNAL_PORTAL_WEBHOOK_URL=${EXTERNAL_PORTAL_WEBHOOK_URL:-}
      - EXTERNAL_PORTAL_WEBHOOK_TOKEN=${EXTERNAL_PORTAL_WEBHOOK_TOKEN:-}
      - ONBOARDING_IMPORT_DIR=${ONBOARDING_IMPORT_DIR:-/app/import}
      - ONBOARDING_IMPORT_HOUR=${ONBOARDING_IMPORT_HOUR:-12}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    networks:
      - app-network

  # Example: Uptime Kuma integration (uncomment to use)
  # uptime-kuma:
  #   image: louislam/uptime-kuma:latest
  #   container_name: uptime-kuma
  #   ports:
  #     - "3001:3001"
  #   volumes:
  #     - uptime_kuma_data:/app/data
  #   restart: unless-stopped
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

volumes:
  tasktracker_data:
  # uptime_kuma_data:  # Uncomment if using Uptime Kuma